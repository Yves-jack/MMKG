name: teaching-smoke

on:
  push:
    paths:
      - "teachkg/**"
      - "scripts/teaching/**"
      - "tests/**"
      - "configs/teaching.yaml"
      - "requirements-teaching.txt"
      - "pytest.ini"
  pull_request:
    paths:
      - "teachkg/**"
      - "scripts/teaching/**"
      - "tests/**"
      - "configs/teaching.yaml"
      - "requirements-teaching.txt"
      - "pytest.ini"

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-teaching.txt
          pip install pytest
      - name: Run teaching smoke tests
        run: |
          python -m pytest tests/test_mmkg_rag.py tests/test_rag_checker_viz.py tests/test_hybrid_rag.py -q
