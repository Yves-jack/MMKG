server {
    listen 80;
    server_name _;

    # Docker 内嵌 DNS；变量 proxy_pass 避免 mmkg-frontend 重建后 IP 过期导致 502
    resolver 127.0.0.11 ipv6=off valid=10s;

    # Vite preview rejects unknown Host (e.g. dlc.sjtu.edu.cn) with 403.
    # Pass a local Host to the preview server; keep original host in X-Forwarded-Host.
    location / {
        set $mmkg_upstream staging-mmkg-frontend;
        proxy_pass http://$mmkg_upstream:5173;
        proxy_http_version 1.1;
        proxy_set_header Host localhost;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 180s;
    }
}
