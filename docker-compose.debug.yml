services:
  mmkg-backend:
    build:
      context: .
      dockerfile: deploy/Dockerfile.backend
      target: debug
    container_name: debug-mmkg-backend
    command: uvicorn mmkg_api.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./service:/app
      - debug-mmkg-data:/data
      - /home/canvas/deploy/key:/tmp/key:ro
    environment:
      MMKG_DATA_DIR: /data
      MMKG_JWT_SECRET: debug-only-mmkg-secret
      JXB_PUBLIC_KEY_PATH: /tmp/key/public.pem
      KG_TOKEN_AUDIENCE: knowledge-graph
      VIDEO_SEARCH_INGEST_TOKEN: ${VIDEO_SEARCH_INGEST_TOKEN:-debug-only-video-token}
      MMKG_CORS_ORIGINS: http://127.0.0.1:${MMKG_DEBUG_PORT:-5174}
    expose:
      - "8000"
    networks:
      staging-runtime:
        aliases:
          - mmkg-backend

  mmkg-debug:
    image: node:22-alpine
    container_name: debug-mmkg-showcase
    working_dir: /workspace/web/teachkg-showcase
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0 --port 5173"
    ports:
      - "127.0.0.1:${MMKG_DEBUG_PORT:-5174}:5173"
    volumes:
      - .:/workspace
      - debug-mmkg-node-modules:/workspace/web/teachkg-showcase/node_modules
      - debug-mmkg-public-data:/workspace/web/teachkg-showcase/public/data
    environment:
      AI_TEACHING_API_URL: http://debug-ai-teaching-backend-main:5001
      MMKG_API_URL: http://mmkg-backend:8000/api
      VITE_MMKG_API_BASE: ${MMKG_DEBUG_BROWSER_API_BASE:-/staging/kg-api}
      VITE_BASE_PATH: ${MMKG_DEBUG_BASE_PATH:-/staging/kg/}
    networks:
      staging-runtime:
        aliases:
          - mmkg-frontend
    depends_on:
      - mmkg-backend

volumes:
  debug-mmkg-node-modules:
  debug-mmkg-public-data:
  debug-mmkg-data:

networks:
  staging-runtime:
    external: true
    name: staging-runtime
